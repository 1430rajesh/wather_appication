<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WeatherNow - Weather App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">☀️</span>
                <span>WeatherNow</span>
            </div>

            <button id="unitToggle" class="unit-btn">
                °C
            </button>
        </header>

        <!-- Search -->
        <section class="search-section">

            <div class="search-box">
                <span class="search-icon">🔍</span>

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Search city..."
                    autocomplete="off"
                >

                <button id="searchBtn">
                    Search
                </button>
            </div>

            <button id="locationBtn" class="location-btn">
                📍 Use My Location
            </button>

        </section>

        <!-- Error -->
        <div id="errorMessage" class="error-message"></div>

        <!-- Loading -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Loading weather...</p>
        </div>

        <!-- Main Weather -->
        <main id="weatherContainer" class="weather-container">

            <!-- Current Weather -->
            <section class="current-weather card">

                <div class="location-info">
                    <p class="country" id="country">India</p>
                    <h1 id="cityName">Chennai</h1>
                    <p id="dateTime">Today</p>
                </div>

                <div class="weather-main">

                    <div class="weather-icon" id="weatherIcon">
                        ☀️
                    </div>

                    <div class="temperature">
                        <span id="temperature">--</span>
                        <span class="degree">°</span>
                    </div>

                    <div class="weather-description">
                        <h2 id="weatherDescription">Clear Sky</h2>
                        <p>
                            Feels like
                            <span id="feelsLike">--</span>°
                        </p>
                    </div>

                </div>

            </section>

            <!-- Weather Details -->
            <section class="details-grid">

                <div class="detail-card card">
                    <div class="detail-icon">💧</div>
                    <div>
                        <p>Humidity</p>
                        <h3><span id="humidity">--</span>%</h3>
                    </div>
                </div>

                <div class="detail-card card">
                    <div class="detail-icon">💨</div>
                    <div>
                        <p>Wind Speed</p>
                        <h3><span id="windSpeed">--</span> km/h</h3>
                    </div>
                </div>

                <div class="detail-card card">
                    <div class="detail-icon">🌡️</div>
                    <div>
                        <p>Pressure</p>
                        <h3><span id="pressure">--</span> hPa</h3>
                    </div>
                </div>

                <div class="detail-card card">
                    <div class="detail-icon">☁️</div>
                    <div>
                        <p>Cloud Cover</p>
                        <h3><span id="cloudCover">--</span>%</h3>
                    </div>
                </div>

            </section>

            <!-- Sunrise Sunset -->
            <section class="sun-section card">

                <div class="sun-item">
                    <div class="sun-icon">🌅</div>
                    <div>
                        <p>Sunrise</p>
                        <h3 id="sunrise">--:--</h3>
                    </div>
                </div>

                <div class="sun-line"></div>

                <div class="sun-item">
                    <div class="sun-icon">🌇</div>
                    <div>
                        <p>Sunset</p>
                        <h3 id="sunset">--:--</h3>
                    </div>
                </div>

            </section>

            <!-- Forecast -->
            <section class="forecast-section">

                <div class="section-title">
                    <h2>5-Day Forecast</h2>
                </div>

                <div id="forecast" class="forecast-grid"></div>

            </section>

            <!-- Recent Searches -->
            <section class="recent-section card">

                <div class="recent-header">
                    <h2>Recent Searches</h2>

                    <button id="clearHistory">
                        Clear
                    </button>
                </div>

                <div id="recentSearches" class="recent-list"></div>

            </section>

        </main>

        <footer>
            <p>
                Weather data provided by Open-Meteo
            </p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
